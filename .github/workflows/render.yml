name: Render slides

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
      - name: Render presentation
        run: quarto render
      - name: Upload presentation
        uses: actions/upload-artifact@v4
        with:
          name: slides-html
          path: _output/
          if-no-files-found: error
          retention-days: 30
